name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for the npm OIDC trusted-publishing exchange
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          # npm guidance: never cache in release builds.
          cache: false
          # No registry-url: setup-vp writes `_authToken=${NODE_AUTH_TOKEN}` to
          # .npmrc; with no secret set it expands to an empty token and stops the
          # npm CLI from starting the OIDC exchange (ENEEDAUTH).
      - run: vp check
      - run: vp test run
      - run: vp pack
      # npm >= 11.5.1 (bundled with setup-vp's Node — 26 currently) performs the
      # OIDC exchange automatically; do not use pnpm publish.
      - run: npm publish --access public
